project:
  packs:
    - pack: Nuvoton::NuMicroM23_DFP
  misc:
    - for-compiler: AC6
      C: [-std=c99, -flto, -fno-rtti, -funsigned-char, -fshort-enums, -fshort-wchar, -ffunction-sections, -fdata-sections, -D__MICROLIB, -gdwarf-4]
      ASM: [-D__MICROLIB]
      Link: [--lto, --library_type=microlib, --map, --load_addr_map_info, --symbols, --info sizes, --info totals, --entry Reset_Handler, --summary_stderr, --info summarysizes, --diag_suppress=6314]
  setups:
    - output:
        type: ["bin"]
  linker:
    - for-compiler: AC6
      script: ../../../../Library/Device/Nuvoton/m2a23/Source/ARM/LDROM.sct
  add-path:
    - ../../../../Library/Device/Nuvoton/m2a23/Include
    - ../../../../Library/StdDriver/inc
    - ../../../../Library/CMSIS/Include
  groups:
    - group: CMSIS
      files:
        - file: ../../../../Library/Device/Nuvoton/m2a23/Source/ARM/startup_m2a23.S
          for-compiler: AC6
        - file: ../../../../Library/Device/Nuvoton/m2a23/Source/system_m2a23.c
    - group: Library
      files:
        - file: ../../../../Library/StdDriver/src/sys.c
        - file: ../../../../Library/StdDriver/src/canfd.c
        - file: ../../../../Library/StdDriver/src/fmc.c
    - group: User
      files:
        - file: ../main.c
